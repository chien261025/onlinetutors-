<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="utf-8">
    <title>ECOURSES - Online Courses HTML Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/client/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/client/css/style.css}" rel="stylesheet">
    <style>
        /* CSS chỉnh sửa nhỏ để thẻ đẹp hơn */
        .hover-primary:hover { color: #FF6600 !important; }
        .text-primary { color: #FF6600 !important; }
        .bg-primary { background-color: #FF6600 !important; }
        .btn-primary { background-color: #FF6600; border-color: #FF6600; color: #fff; }
        .btn-primary:hover { background-color: #e65c00; border-color: #e65c00; }
        .pagination .page-item.active .page-link { background-color: #FF6600; border-color: #FF6600; }
        .pagination .page-link { color: #FF6600; }
    </style>
</head>

<body>
<!-- Topbar Start -->
<div th:replace="~{fragments/clientHeader :: clientHeader}"></div>
<!-- Topbar End -->


<!-- Navbar Start -->
<div th:replace="~{fragments/clientSidebar :: clientSidebar}"></div>
<!-- Navbar End -->


<div class="container-fluid py-5 bg-light">
    <div class="container">

        <div class="row">
            <div class="col-12">
                <div class="mb-4">
                    <h2 class="text-primary font-weight-bold">Một số ebook miễn phí</h2>
                </div>
            </div>

            <div class="row">
                <div class="col-12" th:each="ebook : ${ebooks}">
                    <div class="card border-0 shadow-sm rounded overflow-hidden h-100">
                        <div class="row no-gutters h-100">
                            <div class="col-lg-4 col-md-5">
                                <div class="h-100 bg-light d-flex align-items-center justify-content-center position-relative overflow-hidden" style="min-height: 220px;">
                                    <img                              th:src="@{'/ebook/images/' + ${ebook.imageEbook}}"
                                                                      class="w-100 h-100" style="object-fit: cover; position: absolute;" alt="Course Image">
                                </div>
                            </div>
                            <div class="col-lg-8 col-md-7">
                                <div class="card-body p-4 d-flex flex-column h-100">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <h4 class="font-weight-bold mb-2">
                                            <a href="#" class="text-dark text-decoration-none hover-primary" th:text="${ebook.title}"></a>
                                        </h4>
                                    </div>
                                    <div class="mb-3">
                                        <small class="text-muted mr-3" th:text="${ebook.author}"><i class="fa fa-user mr-1"></i></small>
                                    </div>
                                        <a th:href="@{/ebook/download/{id}(id=${ebook.id})}" class="btn btn-primary py-2 px-4 rounded">tải xuống</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Start -->
<div th:replace="~{fragments/clientFooter :: clientFooter}"></div>
<!-- Footer End -->


<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="fa fa-angle-double-up"></i></a>


<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/client/lib/easing/easing.min.js}"></script>
<script th:src="@{/client/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Contact Javascript File -->
<script th:src="@{/client/mail/jqBootstrapValidation.min.js}"></script>
<script th:src="@{/client/mail/contact.js}"></script>
<script th:src="@{/client/mail/contact.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/client/js/main.js}"></script>
</body>

</html>
