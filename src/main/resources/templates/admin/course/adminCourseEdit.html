<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <title>DASHMIN - Bootstrap Admin Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css}" rel="stylesheet" />

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div class="container-fluid position-relative bg-white d-flex p-0">

    <!-- Sidebar Start -->
    <div class="sidebar pe-4 pb-3">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    </div>
    <!-- Sidebar End -->

    <!-- Content Start -->
    <div class="content">
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
                <div class="col-sm-12 col-xl-6">
                    <div class="bg-light rounded h-100 p-4">
                        <h6 class="mb-4">Create Course</h6>
                        <form th:action="@{/tutor/createCourse}" method="post" th:object="${course}" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="formFile" class="form-label">imager</label>
                                <input class="form-control" type="file" id="formFile"  accept=".png, .jpg, .jpeg"  name="imageCourse">
                            </div>

                            <div class="mb-3">
                                <label for="floatingSelect" class="form-label">Name subject</label>
                                <select class="form-select" id="floatingSelect"
                                        aria-label="Floating label select example" th:field="*{subject}">
                                    <option value="TOAN">Toán</option>
                                    <option value="LY">Lý</option>
                                    <option value="HOa">Hóa</option>
                                    <option value="VAN">Văn</option>
                                    <option value="SINH">Sinh</option>
                                    <option value="ANH">Anh</option>
                                    <option value="SU">Sử</option>
                                    <option value="DIA">Địa</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="Name" class="form-label">Name Course</label>
                                <input th:field="*{nameCourse}" type="text" class="form-control" id="Name"
                                       aria-describedby="emailHelp">
                            </div>
                            <div class="mb-3">
                                <label for="descriptionCourse" class="form-label">DescriptionCourse</label>
                                <textarea th:field="*{descriptionCourse}" class="form-control" id="descriptionCourse"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="Price" class="form-label">Price Course</label>
                                <input  th:field="*{priceCourse}" type="number" class="form-control" id="Price">
                            </div>
                            <button type="submit" class="btn btn-primary">Create</button>
                        </form>
                    </div>
                </div>
                <div class="col-sm-12 col-xl-6">
                    <div class="bg-light rounded h-100 p-4">
                        <h2 class="mb-4">Tạo Lịch Học Theo Tuần cho khóa học <span th:text="${course.nameCourse}"></span></h2>
                        <form th:action="@{/schedule/create}" method="post" th:object="${event}">

                            <div class="mb-3" style="display: none;">
                                <input type="hidden" name="courseId" th:value="${course.id}" />
                            </div>

                            <div class="mb-3" style="display: none;">
                                <label for="title" class="form-label">Title</label>
                                <input type="hidden" class="form-control"  th:field="*{title}" id="title">
                            </div>

                            <!-- Ngày bắt đầu -->
                            <div class="mb-3">
                                <label
                                        for="startDate" class="form-label">Ngày bắt đầu khóa học</label>
                                <input type="date" class="form-control"  th:field="*{startRecur}" id="startDate" required>
                            </div>

                            <!-- Số tuần -->
                            <div class="mb-3">
                                <label for="week" class="form-label">Số tuần học</label>
                                <input type="number" class="form-control"  th:field="*{weeks}" min="1" id="week"  required>
                            </div>

                            <div class="mb-3">
                                <label for="startTime" class="form-label">Giờ bắt đầu</label>
                                <input type="time" th:field="*{startTime}" required id="startTime" />

                                <label for="endTime" class="form-label">Giờ kết thúc</label>
                                <input type="time" th:field="*{endTime}" required id="endTime" />
                            </div>


                            <!-- Chọn ngày trong tuần -->
                            <div class="mb-3">
                                <label class="form-label">Ngày học trong tuần</label>
                                <div class="row">

                                    <div class="col-6 col-md-3">
                                        <label for="MONDAY">Thứ 2</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="MONDAY" id="MONDAY">
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="TUESDAY">Thứ 3</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="TUESDAY" id="TUESDAY">
                                    </div>

                                    <div class="col-6 col-md-3">event
                                        <label for="WEDNESDAY">Thứ 4</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="WEDNESDAY" id="WEDNESDAY">
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="THURSDAY">Thứ 5</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="THURSDAY" id="THURSDAY">
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="FRIDAY">Thứ 6</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="FRIDAY" id="FRIDAY">
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="SATURDAY">Thứ 7</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="SATURDAY" id="SATURDAY">
                                    </div>

                                    <div class="col-6 col-md-3">
                                        <label for="SUNDAY">Chủ nhật</label>
                                        <input type="checkbox"  th:field="*{daysOfWeek}" value="SUNDAY" id="SUNDAY">
                                    </div>

                                </div>
                            </div>

                            <!-- Chọn màu sự kiện -->
                            <div class="mb-3">
                                <label class="form-label">Màu hiển thị</label>
                                <input type="color" class="form-control form-control-color"  th:field="*{color}" value="#1E90FF">
                            </div>

                            <input type="hidden" th:field="*{course}" th:value="${course}" />

                            <button type="submit" class="btn btn-primary">Tạo Lịch</button>

                        </form>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Start -->
        <div th:replace="~{fragments/footer :: footer}"></div>
        <!-- Footer End -->
    </div>
    <!-- Content End -->


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{lib/chart/chart.min.js}"></script>
<script th:src="@{lib/easing/easing.min.js}"></script>
<script th:src="@{lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{lib/owlcarousel/owl.carousel.min.js}"></script>
<script th:src="@{lib/tempusdominus/js/moment.min.js}"></script>
<script th:src="@{lib/tempusdominus/js/moment-timezone.min.js}"></script>
<script th:src="@{lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js}"></script>

<script th:src="@{/js/scripts.js}"></script>
</body>

</html>
